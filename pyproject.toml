[project]
name = "collagio"
dynamic = ["version"]
description = "Desktop photo collage creator for Windows and Linux"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Markus Gamperle" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pillow>=11.0",
    "numpy>=2.1",
    "shapely>=2.0",
    "reportlab>=4.2",
]

[project.optional-dependencies]
gui = ["pyside6-essentials>=6.8"]

[project.scripts]
collagio = "collagio.cli.main:main"

[project.gui-scripts]
collagio-gui = "collagio.app.main:main"

[dependency-groups]
build = [
    "pyinstaller>=6.11",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest-qt>=4.4",
    "pyside6-essentials>=6.8",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "types-reportlab>=5.0.0.20261008",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/collagio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/collagio"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.ruff.lint.per-file-ignores]
# Compound asserts and a literal multiplication sign (size parsing) are intended in tests.
"tests/**" = ["PT018", "RUF001"]
# Qt event handlers must keep Qt's camelCase names.
"src/collagio/app/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["collagio"]

[[tool.mypy.overrides]]
module = ["shapely", "shapely.*"]  # ships no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
pythonpath = ["."]
qt_api = "pyside6"
markers = [
    "golden: compares rendered output against reference images",
    "slow: long-running tests (performance, large images)",
]

[tool.coverage.run]
branch = true
source = ["collagio"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
